<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>技術士 衛生工学 過去問演習</title>
  <style>
    :root {
      --primary: #2563eb;
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #0f172a;
      --border: #e2e8f0;
      --success-bg: #dcfce7;
      --success-text: #15803d;
      --danger-bg: #fee2e2;
      --danger-text: #b91c1c;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Hiragino Kaku Gothic ProN", sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 12px;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 600px;
      background: var(--card);
      padding: 20px 16px;
      border-radius: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    h2 { margin-top: 0; font-size: 1.3rem; text-align: center; color: var(--primary); border-bottom: 2px solid var(--border); padding-bottom: 12px; }
    
    /* 画面切り替え用 */
    .screen { display: none; }
    .screen.active { display: block; }
    
    /* スタート画面 */
    .filter-group { margin-bottom: 16px; }
    .filter-group label { display: block; font-size: 0.9rem; font-weight: bold; margin-bottom: 6px; color: #475569; }
    .filter-select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border); font-size: 1rem; background-color: #f8fafc; color: var(--text); }
    .start-desc { font-size: 0.9rem; color: #64748b; margin-bottom: 20px; line-height: 1.5; }
    
    /* クイズ画面 */
    .header { display: flex; justify-content: space-between; font-size: 0.85rem; color: #64748b; margin-bottom: 12px; font-weight: 600; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
    .question-box { font-size: 1.05rem; font-weight: 600; line-height: 1.5; margin-bottom: 18px; white-space: pre-wrap; }
    .options { display: flex; flex-direction: column; gap: 10px; }
    .option-btn {
      text-align: left; padding: 14px; border: 1.5px solid var(--border); border-radius: 12px; background: #fff; font-size: 0.95rem; line-height: 1.4; color: var(--text); cursor: pointer; transition: 0.2s;
    }
    .option-btn:active:not(:disabled) { background-color: #f8fafc; transform: scale(0.98); }
    .option-btn.correct { background-color: var(--success-bg); border-color: var(--success-text); color: var(--success-text); font-weight: bold; }
    .option-btn.wrong { background-color: var(--danger-bg); border-color: var(--danger-text); color: var(--danger-text); font-weight: bold; }
    .option-btn:disabled { cursor: default; }
    
    .explanation-box { margin-top: 18px; padding: 14px; border-radius: 10px; background-color: #f8fafc; border-left: 4px solid var(--primary); display: none; font-size: 0.9rem; line-height: 1.5; white-space: pre-wrap; }
    .explanation-box.show { display: block; }
    .result-status { font-size: 1rem; font-weight: bold; margin-bottom: 6px; }
    
    /* コントロールボタン */
    .controls { display: flex; gap: 10px; margin-top: 24px; }
    .nav-btn { flex: 1; padding: 14px; border: none; background-color: var(--primary); color: white; border-radius: 10px; font-size: 1rem; font-weight: bold; cursor: pointer; text-align: center; }
    .nav-btn:disabled { background-color: #cbd5e1; color: #94a3b8; }
    .nav-btn.secondary { background-color: #64748b; }
    
    /* リザルト画面 */
    .score-box { text-align: center; padding: 20px; background-color: #f8fafc; border-radius: 12px; margin-bottom: 20px; border: 1px solid var(--border); }
    .score-number { font-size: 2.5rem; font-weight: bold; color: var(--primary); margin: 10px 0; }
    
    .history-list { display: flex; flex-direction: column; gap: 12px; max-height: 60vh; overflow-y: auto; padding-right: 4px; }
    .history-item { padding: 12px; border: 1px solid var(--border); border-radius: 8px; background: #fff; font-size: 0.85rem; line-height: 1.4; }
    .hi-header { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 6px; color: #475569; border-bottom: 1px dashed var(--border); padding-bottom: 4px;}
    .hi-q { margin-bottom: 8px; font-weight: 600; color: var(--text); }
    .hi-ans { display: flex; flex-direction: column; gap: 4px; }
    .hi-mark { font-weight: bold; font-size: 1.1rem; }
    .hi-correct .hi-mark { color: var(--success-text); }
    .hi-wrong .hi-mark { color: var(--danger-text); }
    .ans-row { display: flex; gap: 6px; }
    .ans-label { width: 45px; flex-shrink: 0; color: #64748b; }
  </style>
</head>
<body>

<div class="container" id="app-container">

  <!-- 1. オープニング画面 -->
  <div id="screen-start" class="screen active">
    <h2>出題設定</h2>
    <div class="start-desc">
      演習する「年度」と「分野」を選択して開始してください。全問終了後に結果と回答履歴が表示されます。
    </div>
    
    <div class="filter-group">
      <label for="year-filter">年度</label>
      <select id="year-filter" class="filter-select">
        <option value="all">すべての年度</option>
      </select>
    </div>
    
    <div class="filter-group">
      <label for="genre-filter">分野・ジャンル</label>
      <select id="genre-filter" class="filter-select">
        <option value="all">すべての分野</option>
      </select>
    </div>
    
    <button class="nav-btn" onclick="startQuiz()" style="width: 100%; margin-top: 10px;">演習を開始する</button>
  </div>

  <!-- 2. クイズ画面 -->
  <div id="screen-quiz" class="screen">
    <div class="header">
      <span id="cat-label">分野</span>
      <span id="prog-label">問 1 / 1</span>
    </div>

    <div class="question-box" id="q-text"></div>
    <div class="options" id="opt-box"></div>

    <div class="explanation-box" id="exp-box">
      <div class="result-status" id="res-status"></div>
      <div id="exp-text"></div>
    </div>

    <div class="controls">
      <button class="nav-btn secondary" onclick="quitQuiz()">中断</button>
      <button class="nav-btn" id="next-btn" disabled>回答を選択してください</button>
    </div>
  </div>

  <!-- 3. リザルト画面 -->
  <div id="screen-result" class="screen">
    <h2>演習結果</h2>
    
    <div class="score-box">
      <div>正答率</div>
      <div class="score-number" id="score-text">0%</div>
      <div id="score-detail" style="font-weight: bold; color: #475569;">0 / 0 問 正解</div>
    </div>
    
    <h3 style="font-size: 1rem; color: #475569; border-bottom: 2px solid var(--border); padding-bottom: 4px;">回答履歴</h3>
    <div id="history-list" class="history-list">
      <!-- 履歴がここに入る -->
    </div>
    
    <button class="nav-btn" onclick="goToStart()" style="width: 100%; margin-top: 24px;">設定画面に戻る</button>
  </div>

</div>

  let filteredQuestions = [];
  let curIdx = 0;
  
  // セッション中の回答を保持 { questionId: selectedOptionIndex }
  let sessionAnswers = {};

  // 初期化（セレクトボックスの生成）
  function initApp() {
    const years = new Set();
    const genres = new Set();
    
    allQuestions.forEach(q => {
      if(q.year) years.add(q.year);
      if(q.genre) genres.add(q.genre);
    });

    const yearSelect = document.getElementById('year-filter');
    Array.from(years).sort().reverse().forEach(y => {
      yearSelect.add(new Option(y, y));
    });

    const genreSelect = document.getElementById('genre-filter');
    Array.from(genres).sort().forEach(g => {
      genreSelect.add(new Option(g, g));
    });
  }

  // 画面切り替え
  function switchScreen(screenId) {
    document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
    document.getElementById(screenId).classList.add('active');
  }

  // 演習開始
  function startQuiz() {
    const selectedYear = document.getElementById('year-filter').value;
    const selectedGenre = document.getElementById('genre-filter').value;
    
    filteredQuestions = allQuestions.filter(q => {
      const matchYear = selectedYear === "all" || q.year === selectedYear;
      const matchGenre = selectedGenre === "all" || q.genre === selectedGenre;
      return matchYear && matchGenre;
    });

    if (filteredQuestions.length === 0) {
      alert("条件に一致する問題がありません。別の条件を選択してください。");
      return;
    }

    // 状態リセット
    sessionAnswers = {};
    curIdx = 0;
    
    switchScreen('screen-quiz');
    renderQuestion();
  }

  // 問題描画
  function renderQuestion() {
    const q = filteredQuestions[curIdx];
    document.getElementById("cat-label").textContent = `${q.year} / ${q.genre}`;
    document.getElementById("prog-label").textContent = `問 ${curIdx + 1} / ${filteredQuestions.length}`;
    document.getElementById("q-text").textContent = q.question;

    const optBox = document.getElementById("opt-box");
    optBox.innerHTML = "";

    const expBox = document.getElementById("exp-box");
    const statusBox = document.getElementById("res-status");
    const expTextBox = document.getElementById("exp-text");
    const nextBtn = document.getElementById("next-btn");

    const hasAnswered = sessionAnswers.hasOwnProperty(q.id);

    q.options.forEach((opt, idx) => {
      const btn = document.createElement("button");
      btn.className = "option-btn";
      btn.textContent = opt;

      if (hasAnswered) {
        btn.disabled = true;
        if (idx === q.answer) btn.classList.add("correct");
        if (sessionAnswers[q.id] === idx && idx !== q.answer) btn.classList.add("wrong");
      } else {
        btn.onclick = () => selectOpt(idx);
      }
      optBox.appendChild(btn);
    });

    if (hasAnswered) {
      const isRight = sessionAnswers[q.id] === q.answer;
      statusBox.textContent = isRight ? "〇 正解" : "× 不正解";
      statusBox.style.color = isRight ? "var(--success-text)" : "var(--danger-text)";
      expTextBox.textContent = q.explanation;
      expBox.classList.add("show");
      
      nextBtn.disabled = false;
      if (curIdx === filteredQuestions.length - 1) {
        nextBtn.textContent = "結果を見る";
        nextBtn.onclick = showResults;
      } else {
        nextBtn.textContent = "次の問題へ";
        nextBtn.onclick = goNext;
      }
    } else {
      expBox.classList.remove("show");
      nextBtn.disabled = true;
      nextBtn.textContent = "回答を選択してください";
      nextBtn.onclick = null;
    }
  }

  // 選択肢タップ
  function selectOpt(idx) {
    const q = filteredQuestions[curIdx];
    if(sessionAnswers.hasOwnProperty(q.id)) return; // 重複防止
    
    sessionAnswers[q.id] = idx;
    renderQuestion();
  }

  function goNext() {
    if (curIdx < filteredQuestions.length - 1) {
      curIdx++;
      renderQuestion();
      // 上部へスクロール
      window.scrollTo(0, 0);
    }
  }

  function quitQuiz() {
    if(confirm("演習を中断して設定画面に戻りますか？（履歴はリセットされます）")) {
      goToStart();
    }
  }

  function goToStart() {
    switchScreen('screen-start');
    window.scrollTo(0, 0);
  }

  // 結果画面の表示
  function showResults() {
    let correctCount = 0;
    const historyList = document.getElementById("history-list");
    historyList.innerHTML = "";

    filteredQuestions.forEach((q, index) => {
      const userAnsIdx = sessionAnswers[q.id];
      const isCorrect = userAnsIdx === q.answer;
      if (isCorrect) correctCount++;

      // 履歴アイテム作成
      const item = document.createElement("div");
      item.className = `history-item ${isCorrect ? 'hi-correct' : 'hi-wrong'}`;
      
      const userAnsText = userAnsIdx !== undefined ? q.options[userAnsIdx] : "未回答";
      const correctAnsText = q.options[q.answer];

      item.innerHTML = `
        <div class="hi-header">
          <span>問 ${index + 1} (${q.id})</span>
          <span class="hi-mark">${isCorrect ? '〇 正解' : '× 不正解'}</span>
        </div>
        <div class="hi-q">${q.question}</div>
        <div class="hi-ans">
          <div class="ans-row">
            <span class="ans-label">あなたの回答:</span>
            <span style="color: ${isCorrect ? 'var(--success-text)' : 'var(--danger-text)'};">${userAnsText}</span>
          </div>
          ${!isCorrect ? `
          <div class="ans-row">
            <span class="ans-label">正解:</span>
            <span style="color: var(--success-text); font-weight: bold;">${correctAnsText}</span>
          </div>
          ` : ''}
        </div>
      `;
      historyList.appendChild(item);
    });

    // スコア計算
    const rate = Math.round((correctCount / filteredQuestions.length) * 100);
    document.getElementById("score-text").textContent = `${rate}%`;
    document.getElementById("score-detail").textContent = `${correctCount} / ${filteredQuestions.length} 問 正解`;

    switchScreen('screen-result');
    window.scrollTo(0, 0);
  }

  // 起動時
  initApp();
</script>
